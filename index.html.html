<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dua Quick Access</title>
<style>
:root{--bg:#f7f7f2;--card:#fff;--ink:#1e2b25;--muted:#65736b;--accent:#176b55;--soft:#e7f1ec;--line:#dce5df;--gold:#b07b28}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55}
header{background:linear-gradient(135deg,#123d32,#176b55);color:white;padding:34px 18px 28px;position:sticky;top:0;z-index:5;box-shadow:0 3px 15px #0002}.wrap{max-width:1000px;margin:auto}h1{margin:0 0 4px;font-size:clamp(28px,5vw,44px);letter-spacing:-.03em}header p{margin:0 0 20px;color:#d9eee5}.search{width:100%;border:0;border-radius:14px;padding:15px 17px;font-size:16px;outline:0;box-shadow:0 2px 8px #0002}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.filter,.mode{border:1px solid #ffffff66;background:#ffffff1c;color:#fff;border-radius:999px;padding:8px 13px;cursor:pointer}.filter.active{background:#fff;color:var(--accent)}main{padding:24px 18px 50px}.count{color:var(--muted);font-size:14px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 4px 16px #23382b0a;display:flex;flex-direction:column;gap:10px}.card.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.num{font-weight:700;color:var(--accent);font-size:14px}.tag{font-size:12px;background:var(--soft);color:var(--accent);padding:4px 8px;border-radius:999px}.title{font-size:19px;font-weight:750;margin:0}.arabic{font-family:"Noto Naskh Arabic","Amiri",serif;direction:rtl;text-align:right;font-size:25px;line-height:1.9;background:#fbfaf5;border-radius:12px;padding:12px 14px}.roman{font-style:italic;color:#34453d}.translation{color:#516057}.note{font-size:13px;color:var(--gold);font-weight:650}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}.btn{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:9px;padding:8px 10px;cursor:pointer;font-weight:650}.btn:hover{background:var(--soft)}.empty{display:none;text-align:center;color:var(--muted);padding:50px 10px}.footer{color:var(--muted);font-size:13px;text-align:center;margin-top:25px}.small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap"><h1>Dua Quick Access</h1><p>Search instantly by purpose, Arabic text, Roman Urdu, or English.</p><input id="search" class="search" placeholder="Search duas… e.g. rizq, debt, protection, marriage" autocomplete="off"><div class="tools"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="rizq">Rizq / Money</button><button class="filter" data-filter="protection">Protection</button><button class="filter" data-filter="hidayat">Hidayat / Ease</button><button class="filter" data-filter="family">Family / Marriage</button><button class="filter" data-filter="daily">Daily</button></div></div></header>
<main class="wrap"><p class="count" id="count"></p><section class="grid" id="grid"></section><div class="empty" id="empty">No matching dua found. Try another word.</div><p class="footer">Keep this file on your phone or computer for instant offline access. Text has been arranged from your original document.</p></main>
<script>
const duas=[
[1,'Dua with Wilayat','daily','اللهم انى اسلك بعطائتى و ولايتى يا محمد نبيك و ولايت اميرالمومنين حبيب نبيك','Allahumma inni as’aluka bi’ata’ati wa wilayati ya Muhammad nabiyyik wa wilayati Ameer-ul-Mu’mineen habeeb nabiyyik','', '33 martaba'],
[2,'Ya Muzillu, Ya Mu’izzu, Ya Mughni','rizq','', 'Ya Muzillu, Ya Mu’izzu, Ya Mughni','',''],
[3,'Qibla-Facing Recitation','hidayat','', 'Surah Fatiha, Ayatul Kursi, Surah Qadar aur Surah Ikhlas','Qibla rukh ho kar padhna, dua karna',''],
[4,'Dua to Bibi Zainab (S.A)','protection','', 'Ya Zainab e Kubra (S.A) adrikni','Hadiya to Bibi Zainab (S.A)',''],
[5,'Open My Fortune','rizq','', 'Allahumma inni As’aluka Min Fadlik','O Allah, please open my fortune.',''],
[6,'Guidance and Mercy','hidayat','رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا','Ya man yaf‘alu ma yasha’u wa la yaf‘alu ma yasha’u ahadun ghayruh','',''],
[7,'Allah Is My Lord','daily','اللّه اللّه اللّه رَبّي الرَّحْمَنُ الرَّحِيمُ لا أُشْرِكُ بِهِ شَيْئًا','Allahu Allahu Allahu Rabbi ar-Rahmanu ar-Raheemu laa ushriku bihi shai’an','',''],
[8,'Change Our Circumstances','hidayat','يا مقلب القلوب و الأبصار<br>يا مدبر الليل و النهار<br>يا مُحَوِّلَ الأحوال<br>حوّل حالنا إلى أحسن الحال','Ya Muqallib al-Quloob wa al-Absaar<br>Ya Mudabbir al-Layl wa an-Nahaar<br>Ya Muhawwil al-Ahwal<br>Hawwil haalana ila ahsan al-haal','O One who changes the hearts and visions<br>O One who directs the night and the day<br>O One who changes situation and circumstances<br>Change our circumstance to the best of circumstances',''],
[9,'Call on Imam Hussain and Abbas','protection','يا أبا عبد الله الحسين، يا أبا الفضل العباس، أدركني ولا تُهلكني','Ya Aba Abdillah al-Hussain, Ya Aba al-Fazl al-Abbas, adrikni wa la tuhlikni','',''],
[10,'The Swiftest of Reckoners','daily','', 'Ya Absara an-Nazireena, Ya Asma‘a as-Sami‘eena, Ya Asra‘a al-Hasibeena, Ya Arhama ar-Rahimeen','',''],
[11,'Curse of Aba al-Shurur','protection','', 'O Allah, curse Aba al-Shurur and his followers in every instance according to Your knowledge from primordial existence up till eternity.','','310 martaba'],
[12,'Relief from Worry and Debt','rizq','', 'Allahumma inni a‘udhu bika minal-hammi wal-hazan,<br>wa a‘udhu bika minal-‘ajzi wal-kasal,<br>wa a‘udhu bika minal-bukhli wal-jubn,<br>wa a‘udhu bika min ghalabatid-dayni wa qahrir-rijal','',''],
[13,'Barakah in Wallet and Rizq','rizq','', 'When putting money in your wallet: “Bismillāhi, fī kanzillāhi.”<br><br>When taking money out: “Bismillāhi, min kanzillāhi.”','May Allah put barakah in your rizq.',''],
[14,'Salawat for Imam Ali ibn Musa ar-Riza','daily','', 'Allahumma salli ‘ala Ali ibn Musa ar-Riza…','Long salawat text is preserved in the original document.',''],
[15,'For a Righteous Spouse','family','يا وهّاب هب لي زوجًا صالحًا','Ya Wahhaab, hab li zawjan saalihaan','',''],
[16,'Taqwa, An Opening and Sustenance','rizq','وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا<br>وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ','Wa man yattaqillaha yaj‘al lahu makhraja<br>Wa yarzuqhu min haythu la yahtasib','',''],
[17,'Pay Our Debt and Remove Poverty','rizq','اللهم اقضِ عنا الدين، وأغننا من الفقر','Allahumma iqdi ‘anna ad-dayn, wa aghnina min al-faqr','',''],
[18,'Family and Relationship','family','وَهُوَ الَّذِي خَلَقَ مِنَ الْمَاءِ بَشَرًا فَجَعَلَهُ نَسَبًا وَصِهْرًا وَكَانَ رَبُّكَ قَدِيرًا','Wa huwa alladhi khalaqa minal-ma’i basharan, fa ja‘alahu nasaban wa sihran wa kana rabbuka Qadeera','Surah Al-Furqan (25:54)',''],
[19,'A Barrier from Harm','protection','وَجَعَلْنَا مِن بَيْنِهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لَا يُبْصِرُونَ','Wa ja‘alna min baynihim saddan, wa min khalfihim saddan, fa aghshaynahum fahum la yubsiroon','Surah Ya-Sin (36:9)',''],
[20,'Dua-e-Ghareeq','hidayat','يَا اللهُ يَا رَحْمٰنُ يَا رَحِيمُ<br>يَا مُقَلِّبَ الْقُلُوبِ<br>ثَبِّتْ قَلْبِي عَلَى دِينِك','Ya Allahu, Ya Rahmanu, Ya Rahimu, Ya Muqallibal-Qulub, Thabbit qalbi ‘ala dinik','',''],
[21,'Do Not Make Me Heedless','hidayat','اللهم لا تؤمني مكرك، ولا تنسني ذكرك، ولا تجعلني من الغافلين','Allahumma la tu’minni makrak, wa la tunsini dhikrak, wa la taj‘alni minal-ghaafileen','',''],
[22,'La Matloobi Illallah','daily','', '7 martaba salawat, then:<br>La matloobi illallah<br>La mehboobi illallah<br>La markhubi illallah<br>La ilaha illallah<br><br>7 martaba salawat at the end','',''],
[23,'Dua for the Impossible','hidayat','اللهم سخر لي كل شيء ولو كان في نظري مستحيلاً','Allahumma sakhkhir li kulla shay’in walaw kana fi nazari mustaheelan','Aye Allah, har cheez ko mere liye aasaan bana de, chahe woh meri nazar mein namumkin hi kyun na ho',''],
[24,'Unlimited Sustenance','rizq','إِنَّ اللَّهَ يَرْزُقُ مَن يَشَاءُ بِغَيْرِ حِسَابٍ','Inna Allaha yarzuqu man yashā’u bighayri hisaab','Beshak Allah jisko chahe be-hisab rizq deta hai',''],
[25,'Mercy and Guidance','hidayat','رَبَّنَا آتِنَا مِن لَدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا','Rabbana atina min ladunka rahmatan, wa hayyi lana min amrina rashada','Aye hamare Rabb, apni taraf se hamein rehmat ata farma aur hamare maamlaat mein hidayat de',''],
[26,'Dua of Prophet Yunus','hidayat','لا إله إلا أنت سبحانك إني كنت من الظالمين','La ilaha illa Anta, subhanaka inni kuntu minaz-zalimeen','Tere siwa koi maabood nahi, Tu paak hai; main hi zalimon mein se tha',''],
[27,'Protection from Enemies','protection','اللهم إنا نجعلك في نحورهم ونعوذ بك من شرورهم','Allahumma inna naj‘aluka fi nuhoorihim, wa na‘udhu bika min shuroorihim','Aye Allah, hum unke saamne Tujhe rakhte hain, aur unki buraiyon se Teri panah maangte hain',''],
[28,'Dua for Provision and Good','rizq','رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ','Rabbi inni lima anzalta ilayya min khairin faqeer','Aye Rabb, jo bhi khair Tu mujh par nazil kare, main uska mohtaaj hoon','Quran 28:24']
];
const names={rizq:'Rizq / Money',protection:'Protection',hidayat:'Hidayat / Ease',family:'Family / Marriage',daily:'Daily'};
let active='all'; const grid=document.querySelector('#grid'); const search=document.querySelector('#search');
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function render(){let q=search.value.toLowerCase().trim(),shown=0;grid.innerHTML='';duas.forEach(d=>{let hay=d.join(' ').toLowerCase();if((active==='all'||d[2]===active)&&(!q||hay.includes(q))){shown++;let text=(d[3]||'')+'\n'+d[4]+(d[5]?'\n'+d[5]:'');let c=document.createElement('article');c.className='card';c.innerHTML=`<div class="top"><span class="num">${d[0].toString().padStart(2,'0')}</span><span class="tag">${names[d[2]]}</span></div><h2 class="title">${esc(d[1])}</h2>${d[3]?`<div class="arabic">${d[3]}</div>`:''}<div class="roman">${d[4]}</div>${d[5]?`<div class="translation">${d[5]}</div>`:''}${d[6]?`<div class="note">${d[6]}</div>`:''}<div class="row"><button class="btn copy">Copy</button><button class="btn speak">Read aloud</button></div>`;c.querySelector('.copy').onclick=()=>navigator.clipboard.writeText(text.replaceAll('<br>','\n')).then(()=>c.querySelector('.copy').textContent='Copied');c.querySelector('.speak').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text.replaceAll('<br>','\n')))};grid.appendChild(c)}});document.querySelector('#count').textContent=`Showing ${shown} of ${duas.length} duas`;document.querySelector('#empty').style.display=shown?'none':'block'}
search.addEventListener('input',render);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;render()});render();
</script></body></html>
